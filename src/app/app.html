<app-panel-login *ngIf="!isAuthenticated()" [state]="state"></app-panel-login>

<main class="shell" [class.sidebar-open]="sidebarOpen()" *ngIf="isAuthenticated()">
  <app-menu-lateral [state]="state"></app-menu-lateral>
  <button class="sidebar-backdrop" type="button" aria-label="Cerrar menu" (click)="toggleSidebar()"></button>

  <section class="workspace">
    <header class="topbar">
      <button class="menu-button" type="button" aria-label="Abrir menu" (click)="toggleSidebar()">☰</button>
      <div class="top-title">
        <p class="eyebrow">{{ currentRole() === 'admin' ? 'Panel administrativo' : 'Panel de maestros' }}</p>
        <h2>{{ tab() | titlecase }}</h2>
      </div>
      <div class="top-actions">
        <strong *ngIf="message()">{{ message() }}</strong>
        <button type="button" (click)="logout()">Salir</button>
      </div>
    </header>

    <app-panel-admin *ngIf="tab() === 'dashboard-admin'" [state]="state"></app-panel-admin>
    <app-panel-maestro *ngIf="tab() === 'dashboard-teacher'" [state]="state"></app-panel-maestro>
    <app-panel-asistencias *ngIf="tab() === 'asistencias'" [state]="state"></app-panel-asistencias>
    <app-panel-catalogos *ngIf="tab() === 'catalogos'" [state]="state"></app-panel-catalogos>
    <app-panel-inscripciones *ngIf="tab() === 'inscripciones'" [state]="state"></app-panel-inscripciones>
    <app-panel-reportes *ngIf="tab() === 'reportes'" [state]="state"></app-panel-reportes>
  </section>
</main>
