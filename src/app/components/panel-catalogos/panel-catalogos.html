<section class="grid two">
  <article class="panel">
    <h3>Disciplinas</h3>
    <form (ngSubmit)="state.saveDiscipline()" class="form">
      <input name="disciplineName" [(ngModel)]="state.disciplineForm.name" placeholder="Nombre" required />
      <input name="activityType" [(ngModel)]="state.disciplineForm.activityType" placeholder="Tipo de actividad" required />
      <button>{{ state.editingDisciplineId() ? 'Actualizar' : 'Guardar' }}</button>
      <button type="button" *ngIf="state.editingDisciplineId()" (click)="state.cancelDisciplineEdit()">Cancelar</button>
    </form>
    <div class="item" *ngFor="let item of state.disciplines()">
      <span>
        {{ item.name }}
        <small>{{ item.activityType }} / {{ item.active ? 'ACTIVA' : 'BAJA' }}</small>
      </span>

      <div class="item-actions">
        <button type="button" (click)="state.editDiscipline(item)">Editar</button>
        <button
          type="button"
          [class.restore]="!item.active"
          (click)="item.active ? state.deactivate('disciplines', item.id) : state.reactivate('disciplines', item.id)"
        >
          {{ item.active ? 'Baja' : 'Dar de alta' }}
        </button>
      </div>
    </div>
  </article>

  <article class="panel">
    <h3>Maestros</h3>
    <form (ngSubmit)="state.saveTeacher()" class="form">
      <input name="teacherName" [(ngModel)]="state.teacherForm.name" placeholder="Nombre" required />
      <input name="teacherPhone" [(ngModel)]="state.teacherForm.phone" placeholder="Telefono" />
      <input name="teacherEmail" [(ngModel)]="state.teacherForm.email" placeholder="Correo" />
      <input name="teacherUsername" [(ngModel)]="state.teacherForm.username" placeholder="Usuario" autocomplete="off" required />
      <input
        name="teacherPassword"
        type="password"
        [(ngModel)]="state.teacherForm.password"
        [placeholder]="state.editingTeacherId() ? 'Nueva contraseña (opcional)' : 'Contraseña'"
        autocomplete="new-password"
        [required]="!state.editingTeacherId()"
      />
      <div class="checks">
        <label *ngFor="let discipline of state.disciplines()">
          <input type="checkbox" [checked]="state.isSelected(state.teacherForm.disciplineIds, discipline.id)" (change)="state.toggleSelection(state.teacherForm.disciplineIds, discipline.id)" />
          {{ discipline.name }}
        </label>
      </div>
      <button>{{ state.editingTeacherId() ? 'Actualizar' : 'Guardar' }}</button>
      <button type="button" *ngIf="state.editingTeacherId()" (click)="state.cancelTeacherEdit()">Cancelar</button>
    </form>
    <div class="item" *ngFor="let item of state.teachers()">
      <span>
        {{ item.name }}
        <small>{{ item.username }} / {{ state.disciplineNames(item.disciplines) }} / {{ item.active ? 'ACTIVO' : 'BAJA' }}</small>
      </span>

      <div class="item-actions">
        <button type="button" (click)="state.editTeacher(item)">Editar</button>
        <button
          type="button"
          [class.restore]="!item.active"
          (click)="item.active ? state.deactivate('teachers', item.id) : state.reactivate('teachers', item.id)"
        >
          {{ item.active ? 'Baja' : 'Dar de alta' }}
        </button>
      </div>
    </div>
  </article>

</section>
