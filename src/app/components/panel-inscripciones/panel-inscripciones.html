<section class="grid two">
  <article class="panel">
    <h3>Horarios</h3>
    <form (ngSubmit)="state.saveSchedule()" class="form">
      <input name="scheduleName" [(ngModel)]="state.scheduleForm.name" placeholder="Nombre del horario" required />
      <select name="disciplineId" [(ngModel)]="state.scheduleForm.disciplineId">
        <option *ngFor="let discipline of state.disciplines()" [ngValue]="discipline.id">{{ discipline.name }}</option>
      </select>
      <select name="teacherId" [(ngModel)]="state.scheduleForm.teacherId">
        <option *ngFor="let teacher of state.teachers()" [ngValue]="teacher.id">{{ teacher.name }}</option>
      </select>
      <div class="inline">
        <input name="startTime" type="time" [(ngModel)]="state.scheduleForm.startTime" />
        <input name="endTime" type="time" [(ngModel)]="state.scheduleForm.endTime" />
        <input name="capacity" type="number" min="1" [(ngModel)]="state.scheduleForm.capacity" />
      </div>
      <div class="checks">
        <label *ngFor="let day of state.days">
          <input type="checkbox" [checked]="state.isSelected(state.scheduleForm.days, day.value)" (change)="state.toggleSelection(state.scheduleForm.days, day.value)" />
          {{ day.label }}
        </label>
      </div>
      <button>Guardar</button>
    </form>
    <div class="item" *ngFor="let item of state.schedules()">
      <span>{{ item.name }} <small>{{ item.discipline.name }} / {{ item.teacher.name }}</small></span>
      <button type="button" (click)="state.deactivate('schedules', item.id)">Baja</button>
    </div>
  </article>

  <article class="panel">
    <h3>Inscribir alumnos</h3>
    <form (ngSubmit)="state.saveEnrollment()" class="form">
      <select name="enrollmentStudent" [(ngModel)]="state.enrollmentForm.studentId">
        <option *ngFor="let student of state.students()" [ngValue]="student.id">{{ student.name }}</option>
      </select>
      <select name="enrollmentSchedule" [(ngModel)]="state.enrollmentForm.scheduleId">
        <option *ngFor="let schedule of state.schedules()" [ngValue]="schedule.id">{{ schedule.name }}</option>
      </select>
      <input name="frequency" type="number" min="1" max="7" [(ngModel)]="state.enrollmentForm.frequencyPerWeek" />
      <div class="checks">
        <label *ngFor="let day of state.days">
          <input type="checkbox" [checked]="state.isSelected(state.enrollmentForm.selectedDays, day.value)" (change)="state.toggleSelection(state.enrollmentForm.selectedDays, day.value)" />
          {{ day.label }}
        </label>
      </div>
      <button>Guardar</button>
    </form>
    <div class="item" *ngFor="let item of state.enrollments()">
      <span>{{ item.student.name }} <small>{{ item.schedule.name }} / {{ item.frequencyPerWeek }} dias</small></span>
      <button type="button" (click)="state.deactivate('enrollments', item.id)">Baja</button>
    </div>
  </article>
</section>
