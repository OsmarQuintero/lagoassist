<section class="login-screen">
  <form class="login-box" (ngSubmit)="state.login()">
    <img class="login-logo" src="/clublago-removebg-preview.png" alt="Club del Lago" />
    <p class="eyebrow">Club del Lago A.C.</p>
    <h1>LagoAssist</h1>

    <label>
      Usuario
      <input name="username" [(ngModel)]="state.loginForm.username" autocomplete="username" required />
    </label>

    <label>
      Contraseña
      <input name="password" type="password" [(ngModel)]="state.loginForm.password" autocomplete="current-password" required />
    </label>

    <button>Entrar</button>
    <span class="login-error" *ngIf="state.loginError()">{{ state.loginError() }}</span>
  </form>
</section>
